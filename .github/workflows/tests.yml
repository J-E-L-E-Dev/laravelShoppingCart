name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel / Illuminate 10
          - php: '8.1'
            illuminate: '^10.0'

          - php: '8.2'
            illuminate: '^10.0'

          - php: '8.3'
            illuminate: '^10.0'

          - php: '8.4'
            illuminate: '^10.0'

          # Laravel / Illuminate 11
          - php: '8.2'
            illuminate: '^11.0'

          - php: '8.3'
            illuminate: '^11.0'

          - php: '8.4'
            illuminate: '^11.0'

          # Laravel / Illuminate 12
          - php: '8.2'
            illuminate: '^12.0'

          - php: '8.3'
            illuminate: '^12.0'

          - php: '8.4'
            illuminate: '^12.0'

    name: PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check diff
        # Push: último commit. PR: merge de prueba frente a su primer padre (base).
        run: git diff --check HEAD^ HEAD

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Illuminate version
        run: |
          composer require \
            "illuminate/collections:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/session:${{ matrix.illuminate }}" \
            "illuminate/events:${{ matrix.illuminate }}" \
            "illuminate/database:${{ matrix.illuminate }}" \
            "illuminate/config:${{ matrix.illuminate }}" \
            --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Validate Composer
        run: composer validate --strict

      - name: Run tests
        run: composer test
